services:
  api:
    build: .
    environment:
      DATABASE_URL: postgres://vapor:vapor@postgres:5432/vapor
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vapor
      POSTGRES_USER: vapor
      POSTGRES_PASSWORD: vapor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vapor -d vapor"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
